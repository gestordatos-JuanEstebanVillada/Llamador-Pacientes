services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llamador-backend
    ports:
      - "3914:3914"
    env_file:
      - ./backend/.env
    networks:
      - llamador-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llamador-frontend
    ports:
      - "8527:80"
    depends_on:
      - backend
    networks:
      - llamador-net
    restart: unless-stopped

networks:
  llamador-net:
    driver: bridge
